<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF &amp; Image Tools</title>
<meta name="description" content="Merge, split, compress, scan and convert PDFs and images on your phone. Files never leave your device.">
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#5b5b66; --accent:#d7261e; --line:#e6e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121214; --fg:#ececf0; --muted:#a0a0ab; --accent:#ff6a62; --line:#2a2a30; }
  }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:64px 20px; }
  h1 { font-size:2.2rem; margin:0 0 8px; }
  p { color:var(--muted); }
  a { color:var(--accent); }
  ul { color:var(--fg); padding-left:1.2rem; }
  footer { margin-top:3rem; padding-top:1rem; border-top:1px solid var(--line); font-size:.95rem; }
</style>
</head>
<body>
<main>
  <h1>PDF &amp; Image Tools</h1>
  <p>Everyday PDF and image tools in one app, working entirely on your phone.</p>
  <ul>
    <li>Merge, split, compress and sign PDFs</li>
    <li>Resize, compress and convert images</li>
    <li>Scan paper documents into a PDF</li>
    <li>Your files are never uploaded</li>
  </ul>
  <footer>
    <a href="privacy/">Privacy Policy</a>
  </footer>
</main>
</body>
</html>
